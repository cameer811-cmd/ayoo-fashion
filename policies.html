const content={
en:{title:"Customer policies",intro:"Clear information about delivery, returns, privacy and the terms that apply when shopping with AYOO.",nav:["Delivery","Returns & exchanges","Privacy","Terms"],sections:[
["Delivery","<h3>Where we deliver</h3><p>Online checkout is currently available for delivery addresses in Türkiye only.</p><h3>Delivery time</h3><p>AYOO will confirm the estimated delivery time with you after reviewing your order. If no delivery period is agreed, statutory delivery limits under Turkish consumer law apply.</p><h3>Shipping fees</h3><p>Shipping fees are not included in the product subtotal shown at checkout. AYOO will confirm the applicable shipping charge with you before dispatch. No undisclosed additional charge will be added without your approval.</p><h3>Order confirmation</h3><p>Submitting an order is a request to purchase. AYOO will contact you to confirm availability, delivery details and the final amount payable on delivery.</p>"],
["Returns & exchanges","<h3>14-day right of withdrawal</h3><p>For distance sales, consumers in Türkiye generally have the right to withdraw from the purchase within 14 days from the date they or their designated recipient receive the goods, without giving a reason or paying a penalty. The right may also be exercised before delivery.</p><h3>How to request a return</h3><p>Contact AYOO in writing within the applicable period through our Instagram contact channel. Include your order number, the item you wish to return and your contact details. We will reply with the return instructions and address.</p><h3>Condition of items</h3><p>Please return items with their accessories and packaging where possible. This request does not limit any statutory consumer rights. You may be responsible for changes or deterioration beyond what is necessary to inspect the goods, as provided by applicable law.</p><h3>Refunds</h3><p>Where withdrawal is valid, refunds will be made within the statutory period and using the legally required method. Any delivery charges that must be refunded under Turkish law will be included. Cash-on-delivery orders will be refunded through a method agreed with the consumer and permitted by law.</p><h3>Exchanges and defective items</h3><p>To ask for a size or product exchange, contact us first so we can check stock. Your legal rights concerning defective or non-conforming goods remain unaffected.</p><p>Exceptions to the right of withdrawal apply only where the law expressly provides for them.</p>"],
["Privacy","<h3>Information we collect</h3><p>When you place an order, the checkout asks for your name, email address, phone number and delivery address. Order details and any note you provide are also processed.</p><h3>Why we use it</h3><p>We use this information to receive and manage orders, contact you about confirmation and delivery, provide customer support, prevent misuse and meet applicable legal obligations.</p><h3>Sharing and service providers</h3><p>Information may be shared only as needed with service providers supporting our store, order processing, hosting or delivery, and with public authorities where legally required. We do not sell customer personal data.</p><h3>Security and requests</h3><p>We take reasonable steps to protect order information. You may contact AYOO to ask about your personal data or exercise rights available under applicable privacy law. The final privacy notice must identify the legal data controller and its official contact details before launch.</p>"],
["Terms","<h3>Orders and payment</h3><p>Checkout currently supports cash on delivery for orders addressed in Türkiye. AYOO will confirm product availability, shipping charges and the amount payable before dispatch. Online card payment is not currently offered.</p><h3>Product information</h3><p>We aim to display accurate product descriptions, images, sizes, colours and prices. Colours may look different depending on your screen. If a material error or stock issue affects an order, we will contact you before proceeding.</p><h3>Availability and pricing</h3><p>An item in your bag is not reserved until the order is accepted and processed. Prices and promotions are shown in the currency displayed on the product page and are subject to confirmation before dispatch.</p><h3>Consumer rights</h3><p>Nothing in these terms limits rights that cannot be excluded under applicable Turkish consumer law. Mandatory legal provisions prevail if they conflict with this page.</p><h3>Seller information</h3><p>AYOO’s full legal seller name, registered address, telephone number and official customer-service email must be added here before the store begins accepting public orders.</p>"]
]},
tr:{title:"Müşteri politikaları",intro:"AYOO’dan alışveriş yaparken teslimat, iade, gizlilik ve satış koşulları hakkında açık bilgiler.",nav:["Teslimat","İade ve değişim","Gizlilik","Koşullar"],sections:[
["Teslimat","<h3>Teslimat bölgesi</h3><p>Çevrimiçi sipariş şu anda yalnızca Türkiye’deki teslimat adresleri için sunulmaktadır.</p><h3>Teslimat süresi</h3><p>Tahmini teslimat süresi siparişiniz incelendikten sonra AYOO tarafından teyit edilir. Aksi kararlaştırılmadıkça Türk tüketici mevzuatındaki yasal süreler geçerlidir.</p><h3>Kargo ücreti</h3><p>Gösterilen ürün ara toplamına kargo ücreti dahil değildir. Kargo bedeli gönderimden önce tarafınıza bildirilir. Onayınız olmadan açıklanmamış ek ücret alınmaz.</p><h3>Sipariş teyidi</h3><p>Sipariş gönderimi satın alma talebidir. AYOO; stok, teslimat bilgileri ve kapıda ödenecek toplam tutarı teyit etmek için sizinle iletişime geçer.</p>"],
["İade ve değişim","<h3>14 günlük cayma hakkı</h3><p>Türkiye’de mesafeli satışlarda tüketici, genel olarak ürünü kendisinin veya belirlediği kişinin teslim aldığı tarihten itibaren 14 gün içinde gerekçe göstermeden ve cezai şart ödemeden cayma hakkına sahiptir. Bu hak teslimattan önce de kullanılabilir.</p><h3>İade talebi</h3><p>Yasal süre içinde Instagram iletişim kanalımız üzerinden yazılı olarak bize ulaşın. Sipariş numaranızı, iade etmek istediğiniz ürünü ve iletişim bilgilerinizi paylaşın. İade talimatlarını ve adresini size ileteceğiz.</p><h3>Ürün durumu</h3><p>Mümkünse ürünleri aksesuarları ve ambalajıyla gönderin. Bu talep yasal tüketici haklarını sınırlamaz. Ürünü incelemek için gerekli olanın ötesindeki değişiklik veya değer kaybına ilişkin sorumluluk, mevzuat hükümlerine tabidir.</p><h3>Geri ödeme</h3><p>Geçerli cayma halinde geri ödemeler yasal süre ve yöntemlere uygun yapılır. Türk hukukuna göre iade edilmesi gereken teslimat ücretleri de geri ödemeye dahildir. Kapıda ödeme siparişlerinin iadesi, tüketiciyle kararlaştırılan ve hukuka uygun bir yöntemle yapılır.</p><h3>Değişim ve ayıplı ürün</h3><p>Beden veya ürün değişimi için önce stok durumunu kontrol edebilmemiz adına bizimle iletişime geçin. Ayıplı veya sözleşmeye aykırı ürünlere ilişkin yasal haklarınız saklıdır.</p><p>Cayma hakkının istisnaları yalnızca mevzuatta açıkça belirtilen durumlarda uygulanır.</p>"],
["Gizlilik","<h3>Toplanan bilgiler</h3><p>Sipariş sırasında adınız, e-posta adresiniz, telefon numaranız ve teslimat adresiniz istenir. Sipariş ayrıntıları ve ilettiğiniz notlar da işlenir.</p><h3>Kullanım amaçları</h3><p>Bu bilgiler siparişleri almak ve yönetmek, teyit ve teslimat hakkında sizinle iletişim kurmak, destek sağlamak, kötüye kullanımı önlemek ve yasal yükümlülükleri yerine getirmek için kullanılır.</p><h3>Paylaşım ve hizmet sağlayıcılar</h3><p>Bilgiler yalnızca mağaza, sipariş işleme, barındırma veya teslimatı destekleyen hizmet sağlayıcılarla ve yasal zorunluluk halinde yetkili makamlarla gerekli olduğu ölçüde paylaşılır. Kişisel veriler satılmaz.</p><h3>Güvenlik ve başvurular</h3><p>Sipariş bilgilerini korumak için makul önlemler alırız. Kişisel verilerinizle ilgili talepleriniz için AYOO’ya ulaşabilirsiniz. Mağaza açılmadan önce nihai aydınlatma metninde veri sorumlusunun yasal unvanı ve resmi iletişim bilgileri belirtilmelidir.</p>"],
["Koşullar","<h3>Sipariş ve ödeme</h3><p>Ödeme yöntemi şu anda Türkiye adresli siparişler için kapıda ödemedir. AYOO, gönderimden önce ürün stok durumunu, kargo ücretini ve ödenecek toplam tutarı teyit eder. Çevrimiçi kart ödemesi şu anda sunulmamaktadır.</p><h3>Ürün bilgileri</h3><p>Ürün açıklamalarını, görsellerini, beden, renk ve fiyat bilgilerini doğru sunmaya çalışırız. Renkler ekranınıza göre farklı görünebilir. Siparişi etkileyen önemli bir hata veya stok sorunu varsa işlemden önce sizinle iletişime geçeriz.</p><h3>Stok ve fiyat</h3><p>Sepete eklenen ürün, sipariş kabul edilip işleme alınana kadar rezerve edilmez. Fiyat ve kampanyalar ürün sayfasında belirtilen para birimiyle gösterilir ve gönderimden önce teyit edilir.</p><h3>Tüketici hakları</h3><p>Bu koşullardaki hiçbir hüküm Türk tüketici mevzuatı uyarınca kaldırılamayan hakları sınırlandırmaz. Çelişki halinde emredici hukuk hükümleri uygulanır.</p><h3>Satıcı bilgileri</h3><p>Mağaza herkese açık sipariş kabul etmeden önce AYOO’nun tam yasal satıcı unvanı, kayıtlı adresi, telefon numarası ve resmi müşteri hizmetleri e-posta adresi buraya eklenmelidir.</p>"]
]},
ar:{title:"سياسات العملاء",intro:"معلومات واضحة حول التوصيل والإرجاع والخصوصية وشروط التسوق من AYOO.",nav:["التوصيل","الإرجاع والاستبدال","الخصوصية","الشروط"],sections:[
["التوصيل","<h3>نطاق التوصيل</h3><p>إتمام الطلب عبر الموقع متاح حاليًا لعناوين التوصيل داخل تركيا فقط.</p><h3>مدة التوصيل</h3><p>تؤكد AYOO المدة التقديرية بعد مراجعة الطلب. وإذا لم يتم الاتفاق على مدة محددة، فتُطبق المدد القانونية المنصوص عليها في قوانين حماية المستهلك التركية.</p><h3>رسوم الشحن</h3><p>رسوم الشحن غير مشمولة في المجموع الظاهر للمنتجات عند إتمام الطلب. سنبلغك برسوم الشحن قبل الإرسال، ولن نضيف رسومًا غير معلنة دون موافقتك.</p><h3>تأكيد الطلب</h3><p>إرسال الطلب هو طلب شراء. ستتواصل AYOO معك لتأكيد توفر المنتج وتفاصيل التوصيل والمبلغ النهائي المستحق عند الاستلام.</p>"],
["الإرجاع والاستبدال","<h3>حق العدول خلال 14 يومًا</h3><p>في عقود البيع عن بُعد داخل تركيا، يحق للمستهلك عمومًا العدول عن الشراء خلال 14 يومًا من تاريخ استلامه أو استلام الشخص الذي حدده للمنتج، دون إبداء سبب أو دفع غرامة. ويمكن ممارسة هذا الحق قبل التسليم أيضًا.</p><h3>كيفية طلب الإرجاع</h3><p>تواصل معنا كتابيًا خلال المدة القانونية عبر قناة التواصل على إنستغرام، مع ذكر رقم الطلب والمنتج المراد إرجاعه وبيانات التواصل. سنرسل لك تعليمات الإرجاع والعنوان.</p><h3>حالة المنتج</h3><p>يرجى إعادة المنتج مع ملحقاته وتغليفه قدر الإمكان. لا يحد هذا الطلب من أي حقوق قانونية للمستهلك. وتخضع مسؤولية أي تغيير أو نقص في القيمة يتجاوز ما يلزم لفحص المنتج لأحكام القانون المعمول به.</p><h3>استرداد المبالغ</h3><p>عند قبول العدول قانونًا، تتم إعادة المبالغ خلال المدة وبالطريقة اللتين يحددهما القانون. وتشمل الإعادة رسوم التوصيل التي يوجب القانون ردها. وبالنسبة لطلبات الدفع عند الاستلام، يتم الاتفاق مع المستهلك على وسيلة رد متوافقة مع القانون.</p><h3>الاستبدال والمنتجات المعيبة</h3><p>لطلب استبدال المقاس أو المنتج، تواصل معنا أولًا للتحقق من توفر المخزون. وتبقى حقوقك القانونية المتعلقة بالمنتجات المعيبة أو غير المطابقة محفوظة.</p><p>لا تطبق استثناءات حق العدول إلا في الحالات التي ينص عليها القانون صراحةً.</p>"],
["الخصوصية","<h3>المعلومات التي نجمعها</h3><p>عند تقديم الطلب، يطلب الموقع الاسم والبريد الإلكتروني ورقم الهاتف وعنوان التوصيل. كما تتم معالجة تفاصيل الطلب وأي ملاحظة ترسلها.</p><h3>أسباب الاستخدام</h3><p>نستخدم هذه المعلومات لاستلام الطلبات وإدارتها والتواصل بشأن التأكيد والتوصيل وتقديم الدعم ومنع إساءة الاستخدام والوفاء بالالتزامات القانونية.</p><h3>المشاركة ومقدمو الخدمات</h3><p>قد تتم مشاركة المعلومات بالقدر الضروري مع مقدمي الخدمات الذين يدعمون المتجر أو معالجة الطلبات أو الاستضافة أو التوصيل، ومع الجهات الرسمية عند وجود التزام قانوني. لا نبيع البيانات الشخصية للعملاء.</p><h3>الأمان والطلبات</h3><p>نتخذ تدابير معقولة لحماية معلومات الطلبات. يمكنك التواصل مع AYOO للاستفسار عن بياناتك أو ممارسة الحقوق المقررة في قوانين الخصوصية. يجب استكمال اسم المتحكم القانوني بالبيانات ووسائل الاتصال الرسمية في إشعار الخصوصية النهائي قبل الإطلاق.</p>"],
["الشروط","<h3>الطلبات والدفع</h3><p>طريقة الدفع المتاحة حاليًا هي الدفع عند الاستلام للطلبات داخل تركيا. تؤكد AYOO توفر المنتج ورسوم الشحن والمبلغ النهائي قبل الإرسال. الدفع الإلكتروني بالبطاقات غير متاح حاليًا.</p><h3>معلومات المنتجات</h3><p>نسعى لعرض أوصاف وصور ومقاسات وألوان وأسعار دقيقة. قد تختلف الألوان بحسب الشاشة. إذا ظهر خطأ جوهري أو مشكلة في المخزون تؤثر على الطلب، سنتواصل معك قبل المتابعة.</p><h3>التوفر والأسعار</h3><p>إضافة المنتج إلى السلة لا تعني حجزه حتى قبول الطلب ومعالجته. تعرض الأسعار والعروض بالعملة الموضحة في صفحة المنتج وتُؤكد قبل الإرسال.</p><h3>حقوق المستهلك</h3><p>لا ينتقص أي بند هنا من الحقوق التي لا يجوز استبعادها بموجب قوانين حماية المستهلك التركية. وتكون الأولوية للأحكام القانونية الإلزامية عند التعارض.</p><h3>بيانات البائع</h3><p>يجب إضافة الاسم القانوني الكامل للبائع والعنوان المسجل ورقم الهاتف والبريد الإلكتروني الرسمي لخدمة العملاء هنا قبل بدء استقبال الطلبات العامة.</p>"]
]}}
};
let lang=localStorage.getItem('ayoo-language')||'en';if(!content[lang])lang='en';
function render(){const d=content[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('pageTitle').textContent=d.title;document.getElementById('intro').textContent=d.intro;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const nav=document.getElementById('policyNav'),root=document.getElementById('policyContent');nav.innerHTML='';root.innerHTML='';d.sections.forEach((s,i)=>{const id='policy-'+i,a=document.createElement('a');a.href='#'+id;a.textContent=d.nav[i];nav.append(a);const section=document.createElement('section');section.className='policy';section.id=id;const h=document.createElement('h2');h.textContent=s[0];section.append(h);section.insertAdjacentHTML('beforeend',s[1]);root.append(section)})}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('ayoo-language',lang);render()}));render();
</script>
