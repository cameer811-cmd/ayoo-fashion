
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYOO — Admin Studio</title>
<style>
:root{--wine:#470d1c;--cream:#f4ede4;--gold:#bd9870;--ink:#271b19}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
header{background:var(--wine);color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font:36px Georgia,serif;letter-spacing:-2px}
.logo span{color:var(--gold)}
main{max-width:1000px;margin:35px auto;padding:0 18px}
h1,h2{font-family:Georgia,serif;font-weight:400}
.panel{background:#fffdf9;padding:24px;margin:20px 0;border:1px solid #e4d9cf}
label{display:block;font-size:11px;letter-spacing:1.5px;margin-top:15px;text-transform:uppercase}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #d9cfc5;background:white;font:15px Arial;color:var(--ink)}
textarea{min-height:100px}
input[type=checkbox]{width:auto}
button{padding:13px 19px;border:0;background:var(--wine);color:white;cursor:pointer;margin:8px 5px 8px 0;letter-spacing:1px}
.secondary{background:#e9ded2;color:var(--ink)}
.danger{background:#8b2424}
.hidden{display:none!important}
.status{font-size:13px;color:var(--wine);margin:12px 0;overflow-wrap:anywhere}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.preview-grid img{width:100%;aspect-ratio:3/4;object-fit:cover}
.product{display:grid;grid-template-columns:75px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #e5dbd1}
.product img{width:75px;height:95px;object-fit:cover}
.product p{font-size:12px;color:#88796f}
@media(max-width:600px){.panel{padding:16px}.product{grid-template-columns:65px 1fr}.product img{width:65px;height:85px}.product-actions{grid-column:2}}
</style>
</head>
<body>
<header>
<div class="logo">AY<span>♡</span>O</div>
<small>ADMIN STUDIO</small>
</header>
<main>
<section id="login" class="panel">
<p>AYOO / PRIVATE ACCESS</p>
<h1>Welcome back.</h1>
<form id="loginForm">
<label>Email address</label>
<input id="email" type="email" required>
<label>Password</label>
<input id="password" type="password" required>
<button type="submit">SIGN IN</button>
</form>
<div id="loginStatus" class="status"></div>
</section>

<section id="dashboard" class="hidden">
<h1>Admin Studio.</h1>
<p>Manage your AYOO collection.</p>
<button id="logout" class="secondary">SIGN OUT</button>

<div class="panel">
<h2 id="formTitle">Add a new piece</h2>
<form id="productForm">
<input type="hidden" id="productId">

<label>Product name</label>
<input id="name" required placeholder="The Signature Coat">

<label>Subtitle</label>
<input id="subtitle" placeholder="A study in modern elegance">

<label>Description</label>
<textarea id="description" placeholder="Describe the piece..."></textarea>

<label>Collection</label>
<input id="collection" value="FORM 01">

<label>Product images — select multiple</label>
<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<div id="previewGrid" class="preview-grid"></div>
<p class="status">You can select several images at once. Maximum 10 MB per image.</p>

<label>Display order</label>
<input id="sortOrder" type="number" value="0">

<label><input id="published" type="checkbox" checked> Publish this product</label>

<button type="submit" id="saveButton">SAVE PRODUCT</button>
<button type="button" id="cancelEdit" class="secondary hidden">CANCEL EDIT</button>
</form>
<div id="formStatus" class="status"></div>
</div>

<div class="panel">
<h2>Your collection</h2>
<div id="productsList">Loading products...</div>
</div>
</section>
</main>

<script type="module">
import {supabase} from './config.js';
const $=id=>document.getElementById(id);
let products=[];
let existingImages=[];

function msg(id,text){$(id).textContent=text}

async function checkSession(){
 const {data}=await supabase.auth.getSession();
 if(data.session)showDashboard();
 else $('login').classList.remove('hidden');
}

function showDashboard(){
 $('login').classList.add('hidden');
 $('dashboard').classList.remove('hidden');
 loadProducts();
}

$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();
 msg('loginStatus','Signing in...');
 const {error}=await supabase.auth.signInWithPassword({
  email:$('email').value.trim(),
  password:$('password').value
 });
 if(error){msg('loginStatus',error.message);return}
 msg('loginStatus','');
 showDashboard();
});

$('logout').addEventListener('click',async()=>{
 await supabase.auth.signOut();
 location.reload();
});

async function loadProducts(){
 $('productsList').textContent='Loading products...';
 const {data,error}=await supabase.from('products')
 .select('*').order('sort_order',{ascending:true});
 if(error){$('productsList').textContent=error.message;return}
 products=data||[];
 renderProducts();
}

function renderProducts(){
 const list=$('productsList');
 list.innerHTML='';
 if(!products.length){list.textContent='No products yet.';return}
 products.forEach(p=>{
  const item=document.createElement('div');
  item.className='product';
  const img=document.createElement('img');
  img.src=p.image_url||'';
  const info=document.createElement('div');
  const title=document.createElement('strong');
  title.textContent=p.name||'Untitled';
  const detail=document.createElement('p');
  detail.textContent=(p.collection||'')+' · '+((p.image_urls||[]).length+ (p.image_url?1:0))+' images';
  info.append(title,detail);
  const actions=document.createElement('div');
  actions.className='product-actions';
  const edit=document.createElement('button');
  edit.className='secondary';edit.textContent='EDIT';
  edit.onclick=()=>editProduct(p);
  const del=document.createElement('button');
  del.className='danger';del.textContent='DELETE';
  del.onclick=()=>deleteProduct(p);
  actions.append(edit,del);
  item.append(img,info,actions);
  list.append(item);
 });
}

function editProduct(p){
 $('productId').value=p.id;
 $('name').value=p.name||'';
 $('subtitle').value=p.subtitle||'';
 $('description').value=p.description||'';
 $('collection').value=p.collection||'FORM 01';
 $('sortOrder').value=p.sort_order??0;
 $('published').checked=!!p.published;
 existingImages=[...(p.image_urls||[])];
 if(p.image_url&&!existingImages.includes(p.image_url))existingImages.unshift(p.image_url);
 $('previewGrid').innerHTML='';
 existingImages.forEach(url=>showPreview(url));
 $('formTitle').textContent='Edit product';
 $('saveButton').textContent='UPDATE PRODUCT';
 $('cancelEdit').classList.remove('hidden');
 $('productForm').scrollIntoView({behavior:'smooth'});
}

function showPreview(src){
 const img=document.createElement('img');
 img.src=src;
 $('previewGrid').append(img);
}

function resetForm(){
 $('productForm').reset();
 $('productId').value='';
 $('collection').value='FORM 01';
 $('sortOrder').value='0';
 $('published').checked=true;
 $('images').value='';
 $('previewGrid').innerHTML='';
 existingImages=[];
 $('formTitle').textContent='Add a new piece';
 $('saveButton').textContent='SAVE PRODUCT';
 $('cancelEdit').classList.add('hidden');
}

$('cancelEdit').onclick=resetForm;

$('images').addEventListener('change',()=>{
 $('previewGrid').innerHTML='';
 existingImages.forEach(showPreview);
 [...$('images').files].forEach(file=>{
  const img=document.createElement('img');
  img.src=URL.createObjectURL(file);
  $('previewGrid').append(img);
 });
});

async function uploadImages(files){
 const urls=[];
 for(const file of files){
  if(file.size>10*1024*1024)throw new Error(file.name+' exceeds 10 MB.');
  const ext=file.name.split('.').pop().toLowerCase();
  const path=crypto.randomUUID()+'.'+ext;
  const {error}=await supabase.storage.from('ayoo-media')
   .upload(path,file,{upsert:false});
  if(error)throw error;
  const {data}=supabase.storage.from('ayoo-media').getPublicUrl(path);
  urls.push(data.publicUrl);
 }
 return urls;
}

$('productForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=$('saveButton');
 button.disabled=true;
 msg('formStatus','Saving product and images...');
 try{
  const files=[...$('images').files];
  const uploaded=await uploadImages(files);
  const allImages=[...existingImages,...uploaded];
  const mainImage=allImages[0]||'';
  const product={
   name:$('name').value.trim(),
   subtitle:$('subtitle').value.trim(),
   description:$('description').value.trim(),
   collection:$('collection').value.trim()||'FORM 01',
   image_url:mainImage,
   image_urls:allImages,
   sort_order:Number($('sortOrder').value)||0,
   published:$('published').checked
  };
  const id=$('productId').value;
  let result;
  if(id) result=await supabase.from('products').update(product).eq('id',id);
  else result=await supabase.from('products').insert(product);
  if(result.error)throw result.error;
  msg('formStatus','Product saved successfully.');
  resetForm();
  await loadProducts();
 }catch(error){
  msg('formStatus',error.message||'Something went wrong.');
 }finally{
  button.disabled=false;
 }
});

async function deleteProduct(p){
 if(!confirm('Delete '+p.name+'?'))return;
 const {error}=await supabase.from('products').delete().eq('id',p.id);
 if(error){msg('formStatus',error.message);return}
 msg('formStatus','Product deleted.');
 loadProducts();
}

supabase.auth.onAuthStateChange((_event,session)=>{
 if(session)showDashboard();
 else{
  $('dashboard').classList.add('hidden');
  $('login').classList.remove('hidden');
 }
});
checkSession();
</script>
</body>
</html>
